name: Update University Indexes

on:
  push:
    paths:
      - 'Database/per-university/**'

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Update Script
        run: |
          python scripts/update_indexes.py

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add Database/per-university

          git diff --staged --quiet || git commit -m "Auto update university indexes"

          git push
